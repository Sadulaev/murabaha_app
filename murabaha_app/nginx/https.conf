server {
    listen 80;
    server_name murabaha95.ru www.murabaha95.ru;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name murabaha95.ru www.murabaha95.ru;

    ssl_certificate /etc/letsencrypt/live/murabaha95.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murabaha95.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/app.conf;
}
